name: Stock Analysis Data Scraper

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual run button in GitHub Actions tab

jobs:
  scrape_and_transform:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl requests

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output.json output.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Update stock analysis dynamic data" && git push)
