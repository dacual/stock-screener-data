name: Scheduled Stock Scraping

on:
  schedule:
    # Runs at 00:00 UTC every Monday (or quarterly)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Scraper
        run: python scraper.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_top3.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update sector top 3 JSON"
          git push
